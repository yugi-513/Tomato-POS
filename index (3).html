<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>番茄村咖 · 收银台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EAD8;
  --bg-soft:#EBE0C8;
  --surface:#FBF6EA;
  --surface-hi:#F3E8D0;
  --border:#D9C8A3;
  --border-soft:#E3D5B2;
  --text:#3A2E22;
  --text-dim:#6B5A44;
  --text-mute:#998868;
  --tomato:#C1442D;
  --tomato-dim:#A23821;
  --tomato-tint:#F3DCD1;
  --tomato-text:#8A2E1B;
  --on-accent:#FBF6EA;
  --coffee:#8B5E34;
  --sage:#5F7A52;
  --plum:#6B4A73;
  --teal:#2F6F6B;
  --amber:#C98A28;
  --danger:#C1442D;
  --radius-sm:4px;
  --radius:8px;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:15px;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ---------- Login ---------- */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:500;padding:24px;
}
.login-card{width:100%;max-width:360px;text-align:center;}
.login-mark{
  width:64px;height:64px;border-radius:14px;background:var(--tomato);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--on-accent);
}
.login-title{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 6px;}
.login-sub{color:var(--text-mute);font-size:14px;margin:0 0 28px;}
.cashier-row{display:flex;gap:12px;margin-bottom:16px;}
.cashier-btn{
  flex:1;padding:18px 8px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:16px;font-weight:600;cursor:pointer;
}
.cashier-btn.active{border-color:var(--tomato);background:var(--tomato-tint);color:var(--tomato-text);}
.login-field{
  width:100%;padding:13px 14px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);color:var(--text);margin-bottom:12px;
}
.login-submit{
  width:100%;padding:14px;border-radius:var(--radius);border:none;
  background:var(--tomato);color:var(--on-accent);font-weight:600;font-size:16px;cursor:pointer;
}
.login-error{color:var(--tomato-dim);font-size:13px;margin-top:10px;min-height:16px;}

/* ---------- App shell ---------- */
#app{display:none;height:100vh;flex-direction:column;}
#app.show{display:flex;}
header.topbar{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  border-bottom:1px solid var(--border-soft);background:var(--bg-soft);flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;background:var(--tomato);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-weight:600;color:var(--on-accent);font-size:15px;
}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:17px;}
.sync-pill{
  display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:100px;
  background:var(--surface);font-size:12px;color:var(--text-mute);border:1px solid var(--border-soft);
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);}
.sync-dot.offline{background:var(--amber);}
.topbar-spacer{flex:1;}
.cashier-badge{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:100px;
  background:var(--surface);font-size:13px;border:1px solid var(--border-soft);
}
.cashier-avatar{
  width:22px;height:22px;border-radius:50%;background:var(--coffee);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
}
.icon-btn{
  width:38px;height:38px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.icon-btn:active{background:var(--surface-hi);}

main.workspace{flex:1;display:flex;overflow:hidden;}

/* ---------- Product panel ---------- */
#product-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
.cat-row{
  display:flex;gap:8px;padding:12px 16px 10px;overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--border-soft);
}
.cat-tab{
  flex-shrink:0;padding:8px 16px;border-radius:100px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
}
.cat-tab.active{background:var(--tomato);border-color:var(--tomato);color:var(--on-accent);}
.search-row{padding:0 16px 12px;flex-shrink:0;}
.search-box{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);
}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;}
.search-box input::placeholder{color:var(--text-mute);}
#product-grid{
  flex:1;overflow-y:auto;padding:4px 16px 20px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;
}
.product-card{
  border-radius:var(--radius);background:var(--surface);border:1px solid var(--border-soft);
  padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:88px;
  position:relative;overflow:hidden;
}
.product-card:active{background:var(--surface-hi);}
.product-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat-color,var(--tomato));
}
.product-name{font-size:14px;font-weight:500;line-height:1.3;padding-left:6px;color:var(--text);}
.product-price{font-size:15px;font-weight:600;color:var(--text-dim);margin-top:auto;padding-left:6px;}
.product-price.variable{color:var(--amber);font-size:13px;}
.empty-note{color:var(--text-mute);padding:40px 20px;text-align:center;grid-column:1/-1;}

/* ---------- Cart panel ---------- */
#cart-panel{
  width:360px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg-soft);
  border-left:1px solid var(--border-soft);
}
.cart-head{
  display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border-soft);flex-shrink:0;
}
.cart-head-title{font-family:var(--font-display);font-weight:600;font-size:16px;flex:1;}
.ghost-btn{
  padding:7px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;
}
.ghost-btn:active{background:var(--surface-hi);}
.badge-count{
  background:var(--tomato);color:var(--on-accent);border-radius:100px;font-size:11px;font-weight:700;
  min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;
}
#cart-items{flex:1;overflow-y:auto;padding:8px 16px;}
.cart-empty{color:var(--text-mute);text-align:center;padding:60px 20px;font-size:14px;}
.cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.cart-line-info{flex:1;min-width:0;}
.cart-line-name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.cart-line-unit{font-size:12px;color:var(--text-mute);margin-top:2px;}
.qty-stepper{display:flex;align-items:center;gap:0;flex-shrink:0;}
.qty-btn{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.qty-val{width:26px;text-align:center;font-size:13.5px;font-weight:600;}
.weight-chip{
  padding:5px 10px;border-radius:100px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);font-size:12.5px;font-weight:500;cursor:pointer;flex-shrink:0;
}
.cart-line-total{width:64px;text-align:right;font-size:13.5px;font-weight:600;flex-shrink:0;color:var(--text);}
.cart-line-remove{
  width:22px;height:22px;border-radius:50%;border:none;background:none;color:var(--text-mute);
  cursor:pointer;flex-shrink:0;font-size:16px;line-height:1;
}
.cart-foot{padding:14px 16px;border-top:1px solid var(--border-soft);flex-shrink:0;}
.cart-note-field{
  width:100%;padding:9px 12px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13px;margin-bottom:10px;
}
.totals-row{display:flex;justify-content:space-between;font-size:14px;color:var(--text-dim);margin-bottom:4px;}
.totals-row.grand{font-size:19px;font-weight:600;color:var(--text);margin:8px 0 14px;}
.checkout-btn{
  width:100%;padding:16px;border-radius:var(--radius);border:none;background:var(--tomato);
  color:var(--on-accent);font-size:16px;font-weight:600;cursor:pointer;
}
.checkout-btn:disabled{background:var(--surface);color:var(--text-mute);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(58,46,34,0.42);display:none;align-items:center;justify-content:center;
  z-index:400;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:420px;
  max-height:86vh;display:flex;flex-direction:column;overflow:hidden;
}
.modal-box.wide{max-width:640px;}
.modal-head{
  display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border-soft);flex-shrink:0;
}
.modal-title{font-family:var(--font-display);font-weight:600;font-size:17px;flex:1;color:var(--text);}
.modal-body{padding:18px;overflow-y:auto;}
.field-label{font-size:13px;color:var(--text-dim);margin-bottom:6px;display:block;}
.field-hint{font-size:12px;color:var(--text-mute);margin:-10px 0 14px;}
.field-input{
  width:100%;padding:11px 13px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--bg);color:var(--text);margin-bottom:14px;
}
.field-row{display:flex;gap:10px;}
.field-row .field-input{flex:1;}
.big-amount-input{
  width:100%;padding:16px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:26px;font-weight:600;text-align:center;margin-bottom:10px;
}
.calc-preview{text-align:center;font-size:14px;color:var(--text-dim);margin-bottom:16px;min-height:18px;}
.calc-preview b{color:var(--text);font-size:17px;}
.pay-methods{display:flex;gap:10px;margin-bottom:18px;}
.pay-method-btn{
  flex:1;padding:14px 6px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);
  color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;
}
.pay-method-btn.active{border-color:var(--tomato);background:var(--tomato-tint);color:var(--tomato-text);}
.modal-primary-btn{
  width:100%;padding:14px;border-radius:var(--radius);border:none;background:var(--tomato);
  color:var(--on-accent);font-weight:600;font-size:15px;cursor:pointer;
}
.modal-primary-btn:disabled{background:var(--border-soft);color:var(--text-mute);}
.modal-secondary-btn{
  width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:none;
  color:var(--text-dim);font-weight:500;font-size:14px;cursor:pointer;margin-top:8px;
}
.close-x{width:30px;height:30px;border-radius:50%;border:none;background:none;color:var(--text-mute);font-size:18px;cursor:pointer;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);border:1px solid var(--text);color:var(--bg);
  padding:12px 20px;border-radius:100px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:600;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Drawer menu ---------- */
#drawer-overlay{position:fixed;inset:0;background:rgba(58,46,34,0.35);display:none;z-index:300;}
#drawer-overlay.open{display:block;}
#drawer{
  position:fixed;top:0;right:-280px;bottom:0;width:280px;background:var(--surface);
  border-left:1px solid var(--border);z-index:301;transition:right .2s;display:flex;flex-direction:column;
}
#drawer.open{right:0;}
.drawer-item{
  display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-soft);
  color:var(--text);font-size:15px;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%;
}
.drawer-item:active{background:var(--surface-hi);}
.drawer-item.danger{color:var(--tomato-dim);}

/* ---------- Product manage list ---------- */
.pm-list{max-height:320px;overflow-y:auto;margin-bottom:16px;border:1px solid var(--border-soft);border-radius:var(--radius);}
.pm-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-soft);}
.pm-row:last-child{border-bottom:none;}
.pm-row-info{flex:1;min-width:0;}
.pm-row-name{font-size:13.5px;font-weight:500;color:var(--text);}
.pm-row-meta{font-size:12px;color:var(--text-mute);}
.pm-row-actions{display:flex;gap:6px;}
.pm-mini-btn{
  width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);
  color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;
}
.soldby-row{display:flex;gap:10px;margin-bottom:14px;}
.soldby-btn{
  flex:1;padding:11px 6px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);
  color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;
}
.soldby-btn.active{border-color:var(--tomato);background:var(--tomato-tint);color:var(--tomato-text);}
.swatch-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
.swatch.selected{border-color:var(--text);}
.swatch.none{background:var(--bg);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-mute);}

/* ---------- History ---------- */
.range-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.range-tab{padding:7px 14px;border-radius:100px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:13px;cursor:pointer;}
.range-tab.active{background:var(--tomato);border-color:var(--tomato);color:var(--on-accent);}
.custom-range{display:none;gap:10px;margin-bottom:16px;}
.custom-range.show{display:flex;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.stat-card{background:var(--bg);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border-soft);}
.stat-label{font-size:12px;color:var(--text-mute);margin-bottom:4px;}
.stat-value{font-size:20px;font-weight:600;color:var(--text);}
.hist-section-title{font-family:var(--font-display);font-weight:600;font-size:15px;margin:18px 0 10px;color:var(--text);}
.rank-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
.rank-row .rank-name{color:var(--text-dim);}
.tx-row{padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px;cursor:pointer;}
.tx-row-top{display:flex;justify-content:space-between;margin-bottom:3px;}
.tx-time{color:var(--text-mute);}
.tx-amount{font-weight:600;color:var(--text);}
.tx-detail{color:var(--text-mute);font-size:12px;}

/* ---------- Open tickets ---------- */
.ticket-card{
  border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--bg);
}
.ticket-card:active{background:var(--surface-hi);}
.ticket-card-info{flex:1;}
.ticket-card-name{font-size:14px;font-weight:500;margin-bottom:3px;color:var(--text);}
.ticket-card-meta{font-size:12px;color:var(--text-mute);}
.ticket-card-total{font-size:15px;font-weight:600;color:var(--text);}

@media (max-width:820px){
  #cart-panel{width:320px;}
  #product-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">TK</div>
    <h1 class="login-title">番茄村咖 收银台</h1>
    <p class="login-sub">选择账号并登录</p>
    <div class="cashier-row">
      <button class="cashier-btn" id="btn-select-ug" type="button">UG</button>
      <button class="cashier-btn" id="btn-select-b2" type="button">B2</button>
    </div>
    <input type="password" class="login-field" id="login-password" placeholder="密码">
    <button class="login-submit" id="btn-login" type="button">登录</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">TK</div>
      <div class="brand-name">番茄村咖</div>
    </div>
    <div class="sync-pill" id="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">同步中</span></div>
    <div class="topbar-spacer"></div>
    <div class="cashier-badge"><span class="cashier-avatar" id="cashier-avatar">UG</span><span id="cashier-name-label">UG</span></div>
    <button class="icon-btn" id="btn-menu" type="button" aria-label="菜单">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </header>

  <main class="workspace">
    <section id="product-panel">
      <div class="cat-row" id="cat-row"></div>
      <div class="search-row">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="搜索商品">
        </div>
      </div>
      <div id="product-grid"></div>
    </section>

    <aside id="cart-panel">
      <div class="cart-head">
        <div class="cart-head-title">本单</div>
        <button class="ghost-btn" id="btn-open-tickets" type="button">暂存单 <span class="badge-count" id="ticket-count">0</span></button>
      </div>
      <div id="cart-items"><div class="cart-empty">还没有点单，点左边的商品开始</div></div>
      <div class="cart-foot">
        <input type="text" class="cart-note-field" id="cart-note" placeholder="备注（可选，如：外带、桌号）">
        <div class="totals-row"><span>商品数</span><span id="totals-count">0</span></div>
        <div class="totals-row grand"><span>合计</span><span id="totals-amount">RM 0.00</span></div>
        <button class="checkout-btn" id="btn-checkout" disabled>结账</button>
      </div>
    </aside>
  </main>
</div>

<div id="drawer-overlay"></div>
<div id="drawer">
  <button class="drawer-item" id="drawer-history" type="button">销售记录</button>
  <button class="drawer-item" id="drawer-products" type="button">商品管理</button>
  <button class="drawer-item danger" id="drawer-logout" type="button">登出</button>
</div>

<div class="modal-overlay" id="modal-variable">
  <div class="modal-box">
    <div class="modal-head"><div class="modal-title" id="variable-modal-title">输入金额</div><button class="close-x" data-close="modal-variable">&times;</button></div>

<script>
/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCDY5rXHyUG9p5OM9veSZqjUGPV0MvdHUE",
  authDomain: "organika-order-n-purchase-list.firebaseapp.com",

  messagingSenderId: "963725004292",
  appId: "1:963725004292:web:b3a0b19bd7ffd3c8daef51"
};

let db = null;
let auth = null;
let useFirestore = false;

try{

    console.warn('Firebase SDK 未加载（可能无网络）');

}

const CASHIERS = { UG: 'gardener@tomato.com', B2: 'farmer@tomato.com' };
let currentCashier = null;
let selectedLoginCashier = 'UG';

/* ================= Palette ================= */
const PALETTE = [
  {key:'tomato', hex:'#C1442D'},
  {key:'teal', hex:'#2F6F6B'},
  {key:'amber', hex:'#C98A28'},
  {key:'coffee', hex:'#8B5E34'},
  {key:'sage', hex:'#5F7A52'},
  {key:'plum', hex:'#6B4A73'}
];
function catColor(cat){
  let h=0;
  for(let i=0;i<cat.length;i++) h = (h*31 + cat.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length].hex;
}
function cardColorFor(p){
  return p.color || catColor(p.category);
}

/* ================= Seed data ================= */
/* priceMode: 'fixed' | 'perWeight' | 'manual' */
const SEED_PRODUCTS = [
  {name:'Americano', category:'Drinks', price:7, soldBy:'each', priceMode:'fixed'},
  {name:'Apple Cider Soda', category:'Drinks', price:10, soldBy:'each', priceMode:'fixed'},
  {name:'Avocado Juice', category:'Drinks', price:14, soldBy:'each', priceMode:'fixed'},
  {name:'Bael Juice', category:'Drinks', price:7, soldBy:'each', priceMode:'fixed'},
  {name:'Cappuccino', category:'Drinks', price:12, soldBy:'each', priceMode:'fixed'},
  {name:'Cherry Tomatoes Juice', category:'Drinks', price:10, soldBy:'each', priceMode:'fixed'},
  {name:'Cloud Latte', category:'Drinks', price:14, soldBy:'each', priceMode:'fixed'},
  {name:'Coconut Americano', category:'Drinks', price:12, soldBy:'each', priceMode:'fixed'},
  {name:'Coffee Cherry Tea', category:'Drinks', price:7, soldBy:'each', priceMode:'fixed'},
  {name:'Avocado', category:'Fresh Vegetables', price:null, soldBy:'weight', priceMode:'manual'},
  {name:'Beefsteak Tomato', category:'Fresh Vegetables', price:null, soldBy:'weight', priceMode:'manual'},
  {name:'Carrot', category:'Fresh Vegetables', price:null, soldBy:'weight', priceMode:'manual'},
  {name:'Cherry Tomato in kg', category:'Fresh Vegetables', price:null, soldBy:'weight', priceMode:'manual'},
  {name:'Cherry Tomatoes 650g', category:'Fresh Vegetables', price:15, soldBy:'each', priceMode:'fixed'},
  {name:'Cherry Tomatoes in Box', category:'Fresh Vegetables', price:22, soldBy:'each', priceMode:'fixed'},
  {name:'Cherry Tomatoes in Cup', category:'Fresh Vegetables', price:8, soldBy:'each', priceMode:'fixed'},
  {name:'Cherry Tomatoes in Cup (Large)', category:'Fresh Vegetables', price:12, soldBy:'each', priceMode:'fixed'},
  {name:'Cherry Tomatoes on Vine', category:'Fresh Vegetables', price:null, soldBy:'weight', priceMode:'manual'}
];

/* ================= State ================= */
let products = [];
let categories = [];
let currentCategory = 'all';
let searchTerm = '';
let cart = [];
let cartNote = '';
let pendingVariableProduct = null;
let pendingCheckoutMethod = null;
let sales = [];
let historyRange = 'today';
let pmSoldBy = 'each';
let pmColor = null;

/* ================= Utils ================= */
function fmt(n){ return 'RM ' + (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function priceModeOf(soldBy, priceRaw){
  if(priceRaw===''||priceRaw===null||priceRaw===undefined||isNaN(parseFloat(priceRaw))) return 'manual';
  return soldBy==='weight' ? 'perWeight' : 'fixed';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(btn=>{ btn.addEventListener('click', ()=>closeModal(btn.dataset.close)); });
document.querySelectorAll('.modal-overlay').forEach(ov=>{ ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.classList.remove('open'); }); });

/* ================= Auth ================= */
document.getElementById('btn-select-ug').addEventListener('click', ()=>selectCashier('UG'));
document.getElementById('btn-select-b2').addEventListener('click', ()=>selectCashier('B2'));
function selectCashier(who){
  selectedLoginCashier = who;
  document.getElementById('btn-select-ug').classList.toggle('active', who==='UG');
  document.getElementById('btn-select-b2').classList.toggle('active', who==='B2');
}
selectCashier('UG');

document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function doLogin(){
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!useFirestore){ errEl.textContent = '同步组件未加载，请检查网络后重试'; return; }
  if(!pw){ errEl.textContent = '请输入密码'; return; }
  auth.signInWithEmailAndPassword(CASHIERS[selectedLoginCashier], pw)
    .catch(err=>{ errEl.textContent = '登录失败：密码不对，或者网络有问题'; });
}

if(useFirestore){
  auth.onAuthStateChanged(user=>{
    if(user){
      currentCashier = user.email === CASHIERS.UG ? 'UG' : 'B2';
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').classList.add('show');
      document.getElementById('cashier-avatar').textContent = currentCashier;
      document.getElementById('cashier-name-label').textContent = currentCashier;
      initData();
    }else{
      currentCashier = null;
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').classList.remove('show');
    }
  });
}

document.getElementById('drawer-logout').addEventListener('click', ()=>{
  if(confirm('确定要登出吗？')){ auth.signOut(); closeDrawer(); }
});

/* ================= Sync status ================= */
function setSyncStatus(fromCache){
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if(!navigator.onLine || fromCache){
    dot.classList.add('offline');
    label.textContent = navigator.onLine ? '同步中' : '离线（本地保存中）';
  }else{
    dot.classList.remove('offline');
    label.textContent = '已同步';
  }
}
window.addEventListener('online', ()=>setSyncStatus(false));
window.addEventListener('offline', ()=>setSyncStatus(true));

/* ================= Data init ================= */
function initData(){
  db.collection('pos_meta').doc('seed').get().then(doc=>{
    if(!doc.exists){
      const batch = db.batch();
      SEED_PRODUCTS.forEach(p=>{
        const ref = db.collection('pos_products').doc();
        batch.set(ref, {
          name:p.name, category:p.category, price:p.price, soldBy:p.soldBy, priceMode:p.priceMode,
          color:null, active:true, createdAt: Date.now()
        });
      });
      batch.set(db.collection('pos_meta').doc('seed'), {seeded:true, at:Date.now()});
      batch.commit().catch(e=>console.error('seed失败', e));
    }
  });

  db.collection('pos_products').orderBy('name').onSnapshot({includeMetadataChanges:true}, snap=>{
    setSyncStatus(snap.metadata.fromCache);
    products = [];
    snap.forEach(doc=>{
      const d = doc.data();
      if(!d.priceMode){ d.priceMode = d.variable ? 'manual' : 'fixed'; }
      if(!d.soldBy){ d.soldBy = d.priceMode==='perWeight' ? 'weight' : 'each'; }
      products.push({id:doc.id, ...d});
    });
    products = products.filter(p=>p.active !== false);
    categories = [...new Set(products.map(p=>p.category))];
    renderCategories();
    renderProducts();
    renderProductManageList();
    renderCategorySelect();
  }, err=>console.error('商品同步出错', err));

  db.collection('pos_sales').orderBy('timestampMs','desc').limit(2000).onSnapshot({includeMetadataChanges:true}, snap=>{
    setSyncStatus(snap.metadata.fromCache);
    sales = [];
    snap.forEach(doc=>sales.push({id:doc.id, ...doc.data()}));
    renderHistory();
  }, err=>console.error('销售记录同步出错', err));

  loadOpenTickets();
}

/* ================= Category tabs & product grid ================= */
function renderCategories(){
  const row = document.getElementById('cat-row');
  row.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.className = 'cat-tab' + (currentCategory==='all' ? ' active' : '');
  allTab.textContent = '全部';
  allTab.addEventListener('click', ()=>{ currentCategory='all'; renderCategories(); renderProducts(); });
  row.appendChild(allTab);
  categories.forEach(cat=>{
    const tab = document.createElement('button');
    tab.className = 'cat-tab' + (currentCategory===cat ? ' active' : '');
    tab.textContent = cat;
    tab.addEventListener('click', ()=>{ currentCategory=cat; renderCategories(); renderProducts(); });
    row.appendChild(tab);
  });
}

document.getElementById('search-input').addEventListener('input', e=>{
  searchTerm = e.target.value.trim().toLowerCase();
  renderProducts();
});

function priceLabel(p){
  if(p.priceMode==='fixed') return fmt(p.price||0);
  if(p.priceMode==='perWeight') return fmt(p.price||0) + ' /kg';
  return '价格现场定';
}

function renderProducts(){
  const grid = document.getElementById('product-grid');
  grid.innerHTML = '';
  let list = products;
  if(currentCategory !== 'all') list = list.filter(p=>p.category===currentCategory);
  if(searchTerm) list = list.filter(p=>p.name.toLowerCase().includes(searchTerm));
  if(list.length === 0){ grid.innerHTML = '<div class="empty-note">没有符合的商品</div>'; return; }
  list.forEach(p=>{
    const card = document.createElement('button');
    card.className = 'product-card';
    card.style.setProperty('--cat-color', cardColorFor(p));
    const isVar = p.priceMode !== 'fixed';
    card.innerHTML =
      '<div class="product-name"></div>' +
      '<div class="product-price'+(isVar?' variable':'')+'"></div>';
    card.querySelector('.product-name').textContent = p.name;
    card.querySelector('.product-price').textContent = priceLabel(p);
    card.addEventListener('click', ()=>addToCart(p));
    grid.appendChild(card);
  });
}

/* ================= Cart ================= */
function addToCart(product){
  if(product.priceMode === 'fixed'){
    const existing = cart.find(l=>l.type==='unit' && l.productId===product.id && l.unitPrice===product.price);
    if(existing){ existing.qty += 1; }
    else{ cart.push({type:'unit', productId:product.id, name:product.name, unitPrice:product.price, qty:1}); }
    renderCart();
    return;
  }
  pendingVariableProduct = product;
  document.getElementById('variable-modal-title').textContent = product.name;
  document.getElementById('variable-amount-input').value = '';
  document.getElementById('variable-calc-preview').innerHTML = '&nbsp;';
  if(product.priceMode === 'perWeight'){
    document.getElementById('variable-amount-input').placeholder = '重量 (kg)';
  }else{
    document.getElementById('variable-amount-input').placeholder = '0.00';
  }
  openModal('modal-variable');
  setTimeout(()=>document.getElementById('variable-amount-input').focus(), 100);
}

document.getElementById('variable-amount-input').addEventListener('input', ()=>{
  if(!pendingVariableProduct || pendingVariableProduct.priceMode !== 'perWeight') return;
  const w = parseFloat(document.getElementById('variable-amount-input').value);
  const preview = document.getElementById('variable-calc-preview');
  if(!w || w<=0){ preview.innerHTML = '&nbsp;'; return; }
  const total = w * pendingVariableProduct.price;
  preview.innerHTML = pendingVariableProduct.price.toFixed(2) + ' /kg &times; ' + w + ' kg = <b>' + fmt(total) + '</b>';
});

document.getElementById('variable-confirm-btn').addEventListener('click', ()=>{
  const val = parseFloat(document.getElementById('variable-amount-input').value);
  if(!val || val<=0){ toast('请输入数值'); return; }
  if(pendingVariableProduct.priceMode === 'perWeight'){
    cart.push({
      type:'weight', productId:pendingVariableProduct.id, name:pendingVariableProduct.name,
      ratePerKg: pendingVariableProduct.price, weightKg: val, lineTotal: pendingVariableProduct.price*val
    });
  }else{
    cart.push({type:'unit', productId:pendingVariableProduct.id, name:pendingVariableProduct.name, unitPrice:val, qty:1});
  }
  renderCart();
  closeModal('modal-variable');
});

function lineTotalOf(line){
  return line.type==='weight' ? line.lineTotal : line.unitPrice*line.qty;
}

function renderCart(){
  const wrap = document.getElementById('cart-items');
  if(cart.length===0){
    wrap.innerHTML = '<div class="cart-empty">还没有点单，点左边的商品开始</div>';
  }else{
    wrap.innerHTML = '';
    cart.forEach((line, idx)=>{
      const el = document.createElement('div');
      el.className = 'cart-line';
      if(line.type==='weight'){
        el.innerHTML =
          '<div class="cart-line-info"><div class="cart-line-name"></div><div class="cart-line-unit"></div></div>'+
          '<button class="weight-chip" data-act="editw"></button>'+
          '<div class="cart-line-total"></div>'+
          '<button class="cart-line-remove" data-act="rm">&times;</button>';
        el.querySelector('.cart-line-name').textContent = line.name;
        el.querySelector('.cart-line-unit').textContent = line.ratePerKg.toFixed(2)+' /kg';
        el.querySelector('.weight-chip').textContent = line.weightKg + ' kg';
        el.querySelector('.cart-line-total').textContent = fmt(line.lineTotal);
        el.querySelector('[data-act="editw"]').addEventListener('click', ()=>{
          pendingVariableProduct = {id:line.productId, name:line.name, priceMode:'perWeight', price:line.ratePerKg};
          document.getElementById('variable-modal-title').textContent = line.name;
          document.getElementById('variable-amount-input').placeholder = '重量 (kg)';
          document.getElementById('variable-amount-input').value = line.weightKg;
          document.getElementById('variable-calc-preview').innerHTML = line.ratePerKg.toFixed(2)+' /kg &times; '+line.weightKg+' kg = <b>'+fmt(line.lineTotal)+'</b>';
          cart.splice(idx,1);
          renderCart();
          openModal('modal-variable');
        });
      }else{
        el.innerHTML =
          '<div class="cart-line-info"><div class="cart-line-name"></div><div class="cart-line-unit"></div></div>'+
          '<div class="qty-stepper"><button class="qty-btn" data-act="dec">-</button><span class="qty-val"></span><button class="qty-btn" data-act="inc">+</button></div>'+
          '<div class="cart-line-total"></div>'+
          '<button class="cart-line-remove" data-act="rm">&times;</button>';
        el.querySelector('.cart-line-name').textContent = line.name;
        el.querySelector('.cart-line-unit').textContent = fmt(line.unitPrice) + ' / 件';
        el.querySelector('.qty-val').textContent = line.qty;
        el.querySelector('.cart-line-total').textContent = fmt(line.unitPrice*line.qty);
        el.querySelector('[data-act="inc"]').addEventListener('click', ()=>{ line.qty++; renderCart(); });
        el.querySelector('[data-act="dec"]').addEventListener('click', ()=>{ line.qty--; if(line.qty<=0) cart.splice(idx,1); renderCart(); });
      }
      el.querySelector('[data-act="rm"]').addEventListener('click', ()=>{ cart.splice(idx,1); renderCart(); });
      wrap.appendChild(el);
    });
  }
  const count = cart.reduce((s,l)=> s + (l.type==='weight' ? 1 : l.qty), 0);
  const total = cart.reduce((s,l)=> s + lineTotalOf(l), 0);
  document.getElementById('totals-count').textContent = count;
  document.getElementById('totals-amount').textContent = fmt(total);
  document.getElementById('btn-checkout').disabled = cart.length===0;
}

document.getElementById('cart-note').addEventListener('input', e=>{ cartNote = e.target.value; });

/* ================= Checkout ================= */
document.getElementById('btn-checkout').addEventListener('click', ()=>{
  if(cart.length===0) return;
  const total = cart.reduce((s,l)=>s+lineTotalOf(l),0);
  document.getElementById('checkout-total-display').textContent = fmt(total);
  pendingCheckoutMethod = null;
  document.querySelectorAll('.pay-method-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('checkout-confirm-btn').disabled = true;
  openModal('modal-checkout');
});

document.querySelectorAll('.pay-method-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.pay-method-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    pendingCheckoutMethod = btn.dataset.method;
    document.getElementById('checkout-confirm-btn').disabled = false;
  });
});

document.getElementById('checkout-confirm-btn').addEventListener('click', ()=>{
  if(!pendingCheckoutMethod || cart.length===0) return;
  const now = new Date();
  const total = cart.reduce((s,l)=>s+lineTotalOf(l),0);
  const sale = {
    items: cart.map(l=> l.type==='weight'
      ? {name:l.name, qty:l.weightKg, unitPrice:l.ratePerKg, lineTotal:l.lineTotal, mode:'weight'}
      : {name:l.name, qty:l.qty, unitPrice:l.unitPrice, lineTotal:l.unitPrice*l.qty, mode:'unit'}),
    total: total,
    paymentMethod: pendingCheckoutMethod,
    cashier: currentCashier,
    note: cartNote || '',
    timestamp: now.toISOString(),
    timestampMs: now.getTime()
  };
  db.collection('pos_sales').add(sale).catch(e=>console.error('保存销售记录失败', e));
  cart = [];
  cartNote = '';
  document.getElementById('cart-note').value = '';
  renderCart();
  closeModal('modal-checkout');
  toast('已完成 · ' + fmt(total));
});

/* ================= Open tickets (localStorage) ================= */
const TICKETS_KEY = 'pos_open_tickets_v1';
function loadOpenTickets(){ updateTicketBadge(); }
function getTickets(){ try{ return JSON.parse(localStorage.getItem(TICKETS_KEY) || '[]'); }catch(e){ return []; } }
function saveTickets(list){ localStorage.setItem(TICKETS_KEY, JSON.stringify(list)); updateTicketBadge(); }
function updateTicketBadge(){ document.getElementById('ticket-count').textContent = getTickets().length; }

document.getElementById('btn-open-tickets').addEventListener('click', ()=>{
  const list = getTickets();
  const wrap = document.getElementById('tickets-list');
  wrap.innerHTML = '';
  const holdBtn = document.createElement('button');
  holdBtn.className = 'modal-primary-btn';
  holdBtn.style.marginBottom = '16px';
  holdBtn.textContent = '暂存当前这单';
  holdBtn.disabled = cart.length===0;
  holdBtn.addEventListener('click', ()=>{
    if(cart.length===0) return;
    const tickets = getTickets();
    tickets.push({id:Date.now(), items:cart, note:cartNote, total:cart.reduce((s,l)=>s+lineTotalOf(l),0), createdAt:Date.now()});
    saveTickets(tickets);
    cart = []; cartNote=''; document.getElementById('cart-note').value='';
    renderCart();
    toast('已暂存本单');
    closeModal('modal-tickets');
  });
  wrap.appendChild(holdBtn);
  if(list.length===0){
    const p = document.createElement('div');
    p.className = 'cart-empty';
    p.textContent = '目前没有暂存的单';
    wrap.appendChild(p);
  }
  list.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'ticket-card';
    const time = new Date(t.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    el.innerHTML =
      '<div class="ticket-card-info"><div class="ticket-card-name"></div><div class="ticket-card-meta"></div></div>'+
      '<div class="ticket-card-total"></div><button class="pm-mini-btn" data-del="1">&times;</button>';
    el.querySelector('.ticket-card-name').textContent = t.note ? t.note : (t.items.length+' 项商品');
    el.querySelector('.ticket-card-meta').textContent = time + ' · ' + t.items.length + ' 项';
    el.querySelector('.ticket-card-total').textContent = fmt(t.total);
    el.addEventListener('click', (e)=>{
      if(e.target.dataset.del) return;
      if(cart.length>0 && !confirm('本单还有未结账的商品，恢复暂存单会替换当前内容，确定吗？')) return;
      cart = t.items;
      cartNote = t.note || '';
      document.getElementById('cart-note').value = cartNote;
      renderCart();
      const remaining = getTickets().filter(x=>x.id!==t.id);
      saveTickets(remaining);
      closeModal('modal-tickets');
    });
    el.querySelector('[data-del="1"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm('删除这张暂存单？')) return;
      const remaining = getTickets().filter(x=>x.id!==t.id);
      saveTickets(remaining);
      document.getElementById('btn-open-tickets').click();
    });
    wrap.appendChild(el);
  });
  openModal('modal-tickets');
});

/* ================= Drawer ================= */
function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); }
document.getElementById('btn-menu').addEventListener('click', openDrawer);
document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
document.getElementById('drawer-history').addEventListener('click', ()=>{ closeDrawer(); openModal('modal-history'); setHistoryRange('today'); });
document.getElementById('drawer-products').addEventListener('click', ()=>{ closeDrawer(); openModal('modal-products'); });

/* ================= Product management ================= */
function renderCategorySelect(){
  const sel = document.getElementById('pm-category-select');
  const current = sel.value;
  sel.innerHTML = '';
  categories.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  const newOpt = document.createElement('option');
  newOpt.value = '__new__'; newOpt.textContent = '+ 新增分类';
  sel.appendChild(newOpt);
  if(current) sel.value = current;
}
document.getElementById('pm-category-select').addEventListener('change', e=>{
  document.getElementById('pm-category-new').style.display = e.target.value==='__new__' ? 'block' : 'none';
});

document.querySelectorAll('.soldby-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.soldby-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    pmSoldBy = btn.dataset.soldby;
    updatePmPriceHint();
  });
});
function updatePmPriceHint(){
  const hint = document.getElementById('pm-price-hint');
  if(pmSoldBy==='weight'){
    hint.textContent = '填写每公斤价格 = 结账时输入重量自动算总价；留空 = 结账时手动输入金额';
    document.getElementById('pm-price-label').textContent = '每公斤价格（RM/kg）';
  }else{
    hint.textContent = '留空表示这个商品价格不固定，结账时手动输入金额';
    document.getElementById('pm-price-label').textContent = '价格（RM）';
  }
}

function renderSwatches(){
  const row = document.getElementById('pm-swatch-row');
  row.innerHTML = '';
  const noneSw = document.createElement('div');
  noneSw.className = 'swatch none' + (pmColor===null ? ' selected' : '');
  noneSw.textContent = '×';
  noneSw.addEventListener('click', ()=>{ pmColor = null; renderSwatches(); });
  row.appendChild(noneSw);
  PALETTE.forEach(p=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (pmColor===p.hex ? ' selected' : '');
    sw.style.background = p.hex;
    sw.addEventListener('click', ()=>{ pmColor = p.hex; renderSwatches(); });
    row.appendChild(sw);
  });
}
renderSwatches();
updatePmPriceHint();

function renderProductManageList(){
  const list = document.getElementById('pm-list');
  list.innerHTML = '';
  products.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'pm-row';
    row.innerHTML =
      '<div class="pm-row-info"><div class="pm-row-name"></div><div class="pm-row-meta"></div></div>'+
      '<div class="pm-row-actions"><button class="pm-mini-btn" data-act="edit">改</button><button class="pm-mini-btn" data-act="del">删</button></div>';
    row.querySelector('.pm-row-name').textContent = p.name;
    row.querySelector('.pm-row-meta').textContent = p.category + ' · ' + priceLabel(p);
    row.querySelector('[data-act="edit"]').addEventListener('click', ()=>{
      document.getElementById('pm-edit-id').value = p.id;
      document.getElementById('pm-name').value = p.name;
      renderCategorySelect();
      document.getElementById('pm-category-select').value = p.category;
      document.getElementById('pm-category-new').style.display = 'none';
      document.getElementById('pm-category-new').value = '';
      pmSoldBy = p.soldBy || 'each';
      document.querySelectorAll('.soldby-btn').forEach(b=>b.classList.toggle('active', b.dataset.soldby===pmSoldBy));
      updatePmPriceHint();
      document.getElementById('pm-price').value = p.price===null||p.price===undefined ? '' : p.price;
      pmColor = p.color || null;
      renderSwatches();
      document.getElementById('modal-products').querySelector('.modal-body').scrollTop = 0;
    });
    row.querySelector('[data-act="del"]').addEventListener('click', ()=>{
      if(!confirm('确定删除「'+p.name+'」吗？（不会影响已完成的销售记录）')) return;
      db.collection('pos_products').doc(p.id).update({active:false}).catch(e=>console.error(e));
    });
    list.appendChild(row);
  });
}

document.getElementById('pm-clear-btn').addEventListener('click', clearProductForm);
function clearProductForm(){
  document.getElementById('pm-edit-id').value = '';
  document.getElementById('pm-name').value = '';
  renderCategorySelect();
  document.getElementById('pm-category-select').selectedIndex = 0;
  document.getElementById('pm-category-new').style.display = 'none';
  document.getElementById('pm-category-new').value = '';
  pmSoldBy = 'each';
  document.querySelectorAll('.soldby-btn').forEach(b=>b.classList.toggle('active', b.dataset.soldby==='each'));
  updatePmPriceHint();
  document.getElementById('pm-price').value = '';
  pmColor = null;
  renderSwatches();
}

document.getElementById('pm-save-btn').addEventListener('click', ()=>{
  const id = document.getElementById('pm-edit-id').value;
  const name = document.getElementById('pm-name').value.trim();
  let category = document.getElementById('pm-category-select').value;
  if(category === '__new__'){ category = document.getElementById('pm-category-new').value.trim(); }
  const priceRaw = document.getElementById('pm-price').value;
  if(!name || !category){ toast('请填写商品名称和分类'); return; }
  const priceMode = priceModeOf(pmSoldBy, priceRaw);
  const data = {
    name, category, soldBy: pmSoldBy, priceMode,
    price: priceMode==='manual' ? null : parseFloat(priceRaw),
    color: pmColor, active: true
  };
  if(id){
    db.collection('pos_products').doc(id).update(data).then(()=>{ toast('已更新'); clearProductForm(); }).catch(e=>console.error(e));
  }else{
    data.createdAt = Date.now();
    db.collection('pos_products').add(data).then(()=>{ toast('已新增'); clearProductForm(); }).catch(e=>console.error(e));
  }
});

/* ================= Sales history ================= */
document.querySelectorAll('.range-tab').forEach(tab=>{ tab.addEventListener('click', ()=>setHistoryRange(tab.dataset.range)); });
document.getElementById('range-start').addEventListener('change', renderHistory);
document.getElementById('range-end').addEventListener('change', renderHistory);

function setHistoryRange(range){
  historyRange = range;
  document.querySelectorAll('.range-tab').forEach(t=>t.classList.toggle('active', t.dataset.range===range));
  document.getElementById('custom-range').classList.toggle('show', range==='custom');
  if(range==='custom'){
    const today = new Date().toISOString().slice(0,10);
    if(!document.getElementById('range-start').value) document.getElementById('range-start').value = today;
    if(!document.getElementById('range-end').value) document.getElementById('range-end').value = today;
  }
  renderHistory();
}

function getRangeBounds(){
  const now = new Date();
  let start, end;
  if(historyRange==='today'){
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    end = new Date(start); end.setDate(end.getDate()+1);
  }else if(historyRange==='week'){
    const day = now.getDay() === 0 ? 7 : now.getDay();
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 1);
    end = new Date(start); end.setDate(end.getDate()+7);
  }else if(historyRange==='month'){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth()+1, 1);
  }else{
    const s = document.getElementById('range-start').value;
    const e = document.getElementById('range-end').value;
    start = s ? new Date(s+'T00:00:00') : new Date(0);
    end = e ? new Date(e+'T23:59:59') : new Date();
  }
  return {startMs:start.getTime(), endMs:end.getTime()};
}

function renderHistory(){
  const {startMs, endMs} = getRangeBounds();
  const list = sales.filter(s=>s.timestampMs>=startMs && s.timestampMs<=endMs);
  const revenue = list.reduce((s,x)=>s+x.total,0);
  const cash = list.filter(x=>x.paymentMethod==='cash').reduce((s,x)=>s+x.total,0);
  const noncash = revenue - cash;
  document.getElementById('stat-revenue').textContent = fmt(revenue);
  document.getElementById('stat-count').textContent = list.length;
  document.getElementById('stat-cash').textContent = fmt(cash);
  document.getElementById('stat-noncash').textContent = fmt(noncash);

  const rankMap = {};
  list.forEach(s=>{
    (s.items||[]).forEach(it=>{
      const key = it.name;
      if(!rankMap[key]) rankMap[key] = {qty:0, total:0, mode:it.mode};
      rankMap[key].qty += it.qty;
      rankMap[key].total += it.lineTotal;
    });
  });
  const rankList = Object.entries(rankMap).sort((a,b)=>b[1].total-a[1].total).slice(0,12);
  const rankEl = document.getElementById('rank-list');
  rankEl.innerHTML = '';
  if(rankList.length===0){
    rankEl.innerHTML = '<div class="cart-empty" style="padding:20px 0;">这段时间还没有销售记录</div>';
  }
  rankList.forEach(([name, v])=>{
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.innerHTML = '<span class="rank-name"></span><span></span>';
    row.children[0].textContent = name + ' × ' + v.qty + (v.mode==='weight' ? 'kg' : '');
    row.children[1].textContent = fmt(v.total);
    rankEl.appendChild(row);
  });

  const txEl = document.getElementById('tx-list');
  txEl.innerHTML = '';
  const sorted = [...list].sort((a,b)=>b.timestampMs-a.timestampMs);
  const methodLabel = {cash:'现金', transfer:'银行转账', ewallet:'电子钱包'};
  sorted.slice(0,200).forEach(s=>{
    const row = document.createElement('div');
    row.className = 'tx-row';
    const time = new Date(s.timestampMs).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const itemsText = (s.items||[]).map(it=>it.name+' x'+it.qty+(it.mode==='weight'?'kg':'')).join('，');
    row.innerHTML = '<div class="tx-row-top"><span class="tx-time"></span><span class="tx-amount"></span></div><div class="tx-detail"></div>';
    row.querySelector('.tx-time').textContent = time + ' · ' + (methodLabel[s.paymentMethod]||s.paymentMethod) + ' · ' + (s.cashier||'');
    row.querySelector('.tx-amount').textContent = fmt(s.total);
    row.querySelector('.tx-detail').textContent = itemsText + (s.note ? ('（'+s.note+'）') : '');
    txEl.appendChild(row);
  });
}
